### Official GraphRAG BYOG project for the current medical KG.
### This project reuses the existing KG output instead of rebuilding the graph from raw text.

completion_models:
  default_completion_model:
    model_provider: openai
    model: ${GRAPHRAG_COMPLETION_MODEL}
    api_base: ${GRAPHRAG_COMPLETION_API_BASE}
    auth_method: api_key
    api_key: ${GRAPHRAG_COMPLETION_API_KEY}
    retry:
      type: exponential_backoff

embedding_models:
  default_embedding_model:
    model_provider: openai
    model: ${GRAPHRAG_EMBEDDING_MODEL}
    api_base: ${GRAPHRAG_EMBEDDING_API_BASE}
    auth_method: api_key
    api_key: ${GRAPHRAG_EMBEDDING_API_KEY}
    retry:
      type: exponential_backoff

input:
  type: text

chunking:
  type: tokens
  size: 1200
  overlap: 100
  encoding_model: o200k_base

input_storage:
  type: file
  base_dir: "input"

output_storage:
  type: file
  base_dir: "../official_byog/output"

reporting:
  type: file
  base_dir: "logs"

cache:
  type: json
  storage:
    type: file
    base_dir: "cache"

vector_store:
  type: lancedb
  db_uri: ../official_byog/output/lancedb
  vector_size: 1024
  index_schema:
    entity_description:
      index_name: entity_description
      vector_size: 1024
    community_full_content:
      index_name: community_full_content
      vector_size: 1024
    text_unit_text:
      index_name: text_unit_text
      vector_size: 1024

workflows:
  - generate_text_embeddings

embed_text:
  embedding_model_id: default_embedding_model
  batch_size: 10
  batch_max_tokens: 8191

cluster_graph:
  max_cluster_size: 20

community_reports:
  completion_model_id: default_completion_model
  graph_prompt: "prompts/community_report_graph.txt"
  text_prompt: "prompts/community_report_text.txt"
  max_length: 2000
  max_input_length: 8000

snapshots:
  graphml: false
  embeddings: false

local_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/local_search_system_prompt.txt"
  text_unit_prop: 0.2
  community_prop: 0.05
  top_k_entities: 8
  top_k_relationships: 20
  max_context_tokens: 12000

global_search:
  completion_model_id: default_completion_model
  map_prompt: "prompts/global_search_map_system_prompt.txt"
  reduce_prompt: "prompts/global_search_reduce_system_prompt.txt"
  knowledge_prompt: "prompts/global_search_knowledge_system_prompt.txt"

drift_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/drift_search_system_prompt.txt"
  reduce_prompt: "prompts/drift_reduce_prompt.txt"

basic_search:
  completion_model_id: default_completion_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/basic_search_system_prompt.txt"
